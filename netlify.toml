# ─── Build ────────────────────────────────────────────────────────────────────

[build]
  command   = "hugo --gc --minify"
  publish   = "public"

[build.environment]
  HUGO_VERSION = "0.162.1"
  HUGO_ENV     = "production"
  GO_VERSION   = "1.22"

# Deploy previews / branch deploys must use this deploy's URL as baseURL. Otherwise
# Hugo keeps hugo.toml's production baseURL, styles load from the apex domain, and
# CSP (style-src 'self' on the *.netlify.app document) blocks them → broken layout.
[context.deploy-preview]
  command = "hugo --gc --minify --baseURL $DEPLOY_PRIME_URL/"

[context.branch-deploy]
  command = "hugo --gc --minify --baseURL $DEPLOY_PRIME_URL/"

# ─── Dev server (netlify dev) ─────────────────────────────────────────────────

[dev]
  command = "hugo server --disableFastRender"
  port    = 1313

# ─── Security Headers ─────────────────────────────────────────────────────────

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options            = "SAMEORIGIN"
    X-Content-Type-Options     = "nosniff"
    X-XSS-Protection           = "1; mode=block"
    Referrer-Policy            = "strict-origin-when-cross-origin"
    Permissions-Policy         = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security  = "max-age=63072000; includeSubDomains; preload"
    # Embedded providers: Typeform and Zeffy
    Content-Security-Policy    = "default-src 'self'; script-src 'self' 'unsafe-inline' https://embed.typeform.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; form-action 'self' https://form.typeform.com; frame-src 'self' https://form.typeform.com https://*.typeform.com https://www.zeffy.com https://*.zeffy.com; connect-src 'self' https://api.typeform.com https://form.typeform.com https://*.typeform.com https://embed.typeform.com; frame-ancestors 'none'; base-uri 'self';"

# ─── Cache: immutable assets (Hugo fingerprinted filenames) ───────────────────

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/favicon.svg"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# ─── Redirects ────────────────────────────────────────────────────────────────

# Ensure www → apex redirect (set canonical domain in Netlify dashboard too)
[[redirects]]
  from   = "https://www.justiceaccessfoundation.org/*"
  to     = "https://justiceaccessfoundation.org/:splat"
  status = 301
  force  = true

# campus-study → rental-dispute-intake (page renamed 2026; keep old links alive)
[[redirects]]
  from   = "/campus-study/*"
  to     = "/rental-dispute-intake/:splat"
  status = 301

[[redirects]]
  from   = "/es/campus-study/*"
  to     = "/es/rental-dispute-intake/:splat"
  status = 301

[[redirects]]
  from   = "/zh/campus-study/*"
  to     = "/zh/rental-dispute-intake/:splat"
  status = 301

# ─── Form notifications (configure recipients in Netlify dashboard) ───────────
# Forms registered here are discovered by Netlify at build time.
# Actual notification routing is configured in the Netlify UI under Forms → Settings.
#
# Forms in use:
#   donation-inquiry  (EN donate page)
#   donacion          (ES donate page)
#   juankuan          (ZH donate page)
#   contact           (EN contact page)
#   contacto          (ES contact page)
#   lianxi            (ZH contact page)
