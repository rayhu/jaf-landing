# Verifies every PR and push to main builds cleanly (matches Netlify’s pinned Hugo/Go).
# Deploy previews and production deploys are handled by Netlify’s Git integration — see SETUP.md §9.

name: Hugo CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: hugo-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: go.sum

      - name: Setup Hugo (extended)
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.155.3"
          extended: true

      - name: Build
        run: hugo --gc --minify
