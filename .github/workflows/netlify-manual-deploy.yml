# Optional: deploy from GitHub Actions (manual trigger only).
# Default workflow: connect this repo in Netlify — PRs get Deploy Previews, merges to main go to production.
# Use this workflow only if you need a CLI deploy from CI (requires NETLIFY_* secrets).

name: Netlify manual deploy

on:
  workflow_dispatch:
    inputs:
      production:
        description: "Deploy to production (live site)"
        required: true
        default: false
        type: boolean

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: go.sum

      - name: Setup Hugo (extended)
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.155.3"
          extended: true

      - name: Build
        run: hugo --gc --minify

      - name: Install Netlify CLI
        run: npm install -g netlify-cli

      - name: Deploy (draft preview)
        if: ${{ inputs.production == false }}
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: netlify deploy --dir=public --message="GitHub Actions draft ${{ github.sha }}"

      - name: Deploy (production)
        if: ${{ inputs.production == true }}
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: netlify deploy --dir=public --prod --message="GitHub Actions production ${{ github.sha }}"
