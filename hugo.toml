baseURL = "https://justiceaccessfoundation.org/"
title   = "Justice Access Foundation"

[author]
  name = "Justice Access Foundation"

enableRobotsTXT = true
summaryLength   = 0

defaultContentLanguage        = "en"
defaultContentLanguageInSubdir = false

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

# ─── Taxonomies (hub pages for programmatic SEO: /issues/<x>/, /jurisdictions/<y>/) ──
# Defining these replaces Hugo's default tags/categories (unused on this site).

[taxonomies]
  issue        = "issues"
  jurisdiction = "jurisdictions"

# ─── Languages ────────────────────────────────────────────────────────────────

[languages]

  [languages.en]
    title        = "Justice Access Foundation"
    label = "English"
    weight       = 1
    contentDir   = "content/en"

  [languages.zh]
    title        = "美国司法可及基金会"
    label = "中文"
    weight       = 2
    contentDir   = "content/zh"

  [languages.es]
    title        = "Justice Access Foundation"
    label = "Español"
    weight       = 3
    contentDir   = "content/es"
