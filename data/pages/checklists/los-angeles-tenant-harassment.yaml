i18n:
  en:
    status: draft
    reviewedBy: ""
    reviewedDate: ""
    title: "Los Angeles Tenant Harassment Checklist"
    description: "A step-by-step checklist for Los Angeles renters who believe their landlord is harassing them — what to document, your rights under the LA Tenant Anti-Harassment Ordinance, and where to report."
    lead: "If your landlord is pressuring, threatening, or trying to force you out, the Los Angeles Tenant Anti-Harassment Ordinance (TAHO) may protect you. Use this checklist to document what's happening and take action."
    intro_md: |
      Los Angeles prohibits landlords from harassing tenants — including cutting off services,
      repeated unwanted entries, threats, and bad-faith efforts to make you leave. Strong
      documentation is the foundation of any harassment complaint. Work through this checklist.
    items:
      - text_md: "**Write down every incident** with the date, time, location, who was involved, and exactly what was said or done."
      - text_md: "**Save all written communication** — texts, emails, letters, and notices from your landlord or their agents."
      - text_md: "**Photograph or video** conditions or incidents where safe and legal to do so (e.g., utilities shut off, locks changed)."
      - text_md: "**Keep names and contact info of witnesses** — neighbors, family, anyone who saw or heard what happened."
      - text_md: "**Identify which prohibited conduct applies** under the LA Tenant Anti-Harassment Ordinance and note it next to each incident."
      - text_md: "**Report it** to the LA Housing Department, and consider [contacting us](/rental-dispute-intake/) or a local legal aid office for help."

  es:
    status: draft
    reviewedBy: ""
    reviewedDate: ""
    title: "Lista de verificación de acoso al inquilino en Los Ángeles"
    description: "Una lista paso a paso para inquilinos de Los Ángeles que creen que su propietario los está acosando: qué documentar, sus derechos bajo la Ordenanza contra el Acoso al Inquilino de LA y dónde denunciar."
    lead: "Si su propietario lo presiona, amenaza o intenta obligarlo a irse, la Ordenanza contra el Acoso al Inquilino de Los Ángeles (TAHO) puede protegerlo. Use esta lista para documentar lo que ocurre y actuar."
    intro_md: |
      Los Ángeles prohíbe que los propietarios acosen a los inquilinos, incluido cortar servicios,
      entradas repetidas no deseadas, amenazas y esfuerzos de mala fe para hacerlo salir. Una buena
      documentación es la base de cualquier queja por acoso. Siga esta lista.
    items:
      - text_md: "**Anote cada incidente** con la fecha, hora, lugar, quiénes participaron y exactamente qué se dijo o hizo."
      - text_md: "**Guarde toda comunicación escrita**: mensajes de texto, correos, cartas y avisos de su propietario o sus agentes."
      - text_md: "**Tome fotos o video** de las condiciones o incidentes cuando sea seguro y legal (por ejemplo, servicios cortados, cerraduras cambiadas)."
      - text_md: "**Guarde nombres y contactos de testigos**: vecinos, familiares, cualquiera que haya visto u oído lo ocurrido."
      - text_md: "**Identifique qué conducta prohibida aplica** según la Ordenanza contra el Acoso al Inquilino de LA y anótela junto a cada incidente."
      - text_md: "**Denúncielo** al Departamento de Vivienda de LA, y considere [contactarnos](/es/rental-dispute-intake/) o a una oficina local de ayuda legal."

