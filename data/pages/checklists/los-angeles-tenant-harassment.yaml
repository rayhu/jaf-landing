    lead: "如果房东施压、威胁或试图迫使您搬走，洛杉矶《反租客骚扰条例》（TAHO）可能保护您。请用此清单记录事件并采取行动。"
    intro_md: |
      洛杉矶禁止房东骚扰租客——包括切断服务、反复擅自进入、威胁，以及恶意迫使您搬离。充分的记录是
