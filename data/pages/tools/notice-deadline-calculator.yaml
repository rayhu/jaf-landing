    description: "Calculadora gratuita: ingrese la fecha en que recibió un aviso de desalojo o terminación en California y vea su plazo para responder, excluyendo fines de semana y feriados judiciales."
    lead: "¿Recibió un aviso? Ingrese la fecha para estimar su plazo para responder, contando fines de semana y feriados judiciales de California como lo hace la ley."
    intro_md: |
      La cantidad de días en su aviso no siempre es igual a la cantidad de días del calendario. Algunos
      avisos se cuentan en **días hábiles del tribunal** (sin fines de semana ni feriados judiciales);
      otros suman días adicionales cuando le notifican por correo. Ingrese sus datos para estimar su plazo.
