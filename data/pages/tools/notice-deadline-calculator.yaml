    title: "California Eviction Notice Deadline Calculator"
    description: "Free calculator: enter the date you were served a California eviction or termination notice and see your response deadline, excluding weekends and court holidays."
    lead: "Served a notice? Enter the date below to estimate your deadline to respond — counting weekends and California court holidays the way the law does."
    intro_md: |
      The number of days on your notice is not always the same as the number of days on the calendar.
      Some notices are counted in **court days** (skipping weekends and court holidays); some add extra
      days when you're served by mail. Enter your details below to estimate your deadline.
